# =============================================================
# 项目 B 专用 broker 配置
#
# ⚠ 这是一套**独立于项目 A** 的 RocketMQ 集群（集群名、broker 名、
#    宿主端口都与 A 不同），两个项目可以同时跑起来互不干扰。
#
#    项目 A：CityCluster / broker-a  ，宿主端口 9876 / 10909 / 10911
#    项目 B：本文件        / broker-city，宿主端口 9877 / 10919 / 10921
#
# 为什么不复用项目 A 的那套：
#   1. docker compose 各自创建独立 bridge 网络，跨 compose 的容器 DNS 不互通
#      —— city-url-app 解析不到项目 A 的 rocketmq-namesrv。
#      硬要连通得把两个项目挂到同一个 external 网络，耦合死且部署顺序有依赖。
#   2. 项目 B 必须能单独 `docker compose up` 跑起来演示（面试现场的基本要求）。
# =============================================================

brokerClusterName = CityShortUrlCluster
brokerName = broker-city
brokerId = 0

# 异步刷盘 + 异步复制：开发/演示环境优先吞吐与低延迟。
# 生产若要求「宕机不丢消息」，应改成 SYNC_FLUSH（代价是 RT 上升一个量级）。
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

namesrvAddr = rocketmq-namesrv:9876

# 开发环境允许自动创建 topic：第一次发送到不存在的 topic 时由 broker 自动建。
# ⚠ 生产必须关掉，改为**预创建 + 显式指定队列数** ——
#    自动创建的 topic 只有 4 个队列，且不会做权限/配额校验。
autoCreateTopicEnable = true

# -------------------------------------------------------------
# 刻意**不设** brokerIP1：
#   broker 会自动探测容器自己的 IP（172.x），而应用容器与它在同一个
#   compose 网络里，直连没问题。
#
#   项目 A 之所以设 brokerIP1 = host.docker.internal，是因为它要绕
#   「容器 → 宿主发布端口 → broker」这条路；本项目不需要绕。
#
# ⚠ 如果要让**宿主机上**的工具（比如 RocketMQ Dashboard）连进来，
#   才需要设成宿主可达的地址。
# -------------------------------------------------------------
