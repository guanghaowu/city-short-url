spring:
  profiles:
    active: dev
  application:
    name: city-short-url
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 项目 A 占 8080（后端）/ 8081（前端），本项目用 8082
server:
  port: 8082
  servlet:
    context-path: /

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-fetch-size: 100
  global-config:
    banner: false
    db-config:
      # 主键策略：由雪花算法生成（Step 2 实现）。
      # 注意 MyBatis-Plus 只在实体 id 为空时才生成，手动 set 过的不覆盖，
      # 所以 short_url 用自己的雪花 ID、access_log 用自增 ID 可以共存。
      id-type: ASSIGN_ID
  mapper-locations: classpath:mapper/*.xml

# ===== RocketMQ（Step 7：访问日志异步化）=====
# ⚠ 必须放在**顶层**，不能塞进 spring: 下面 —— rocketmq-spring-boot-starter
#   读的是根级的 rocketmq.* 前缀，放到 spring 下它读不到（项目 A 踩过这个坑）。
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: short-url-producer
    # 访问日志是「尽力而为」的旁路数据：丢了只是少一条统计，不影响跳转。
    # 所以超时设短（默认 3000ms），让 broker 异常时尽快把失败交给回调，
    # 而不是让失败在客户端内部长时间挂着重试。
    send-message-timeout: 3000
    retry-times-when-send-failed: 1

app:
  rate-limit:
    # 全局开关。压测要播种 2000 条短链时会撞上限流，用
    # APP_RATELIMIT_ENABLED=false 临时关掉（见 bench/run-bench.sh）。
    enabled: ${APP_RATELIMIT_ENABLED:true}

  bloom:
    # 总开关。压测时用 APP_BLOOM_ENABLED=false 起一份「无布隆」的对照实例，
    # 用来量化「布隆到底省掉了多少次 DB 查询」——没有对照组的性能数字不可信。
    enabled: ${APP_BLOOM_ENABLED:true}
    # 布隆过滤器的预估容量与误判率。
    # 容量设小了会让位图提前「饱和」，误判率急剧上升 —— 布隆一旦创建就无法扩容，
    # 所以宁可往大了设（10 万元素 + 1% 误判率约占 120 KB 内存，很便宜）。
    expected-insertions: 100000
    fpp: 0.01

  cache:
    # 映射缓存基准 TTL（小时）
    ttl-hours: 24
    # 雪崩防护：在基准 TTL 上叠加 [0, jitter] 秒的随机抖动。
    # 若所有 key 都用同一个 TTL，在某个时刻批量写入的 key 会在同一秒集体失效，
    # 瞬时流量全部压到 DB —— 这就是缓存雪崩。抖动把失效时间摊平。
    ttl-jitter-seconds: 1800
    # 穿透二次兜底：布隆有 1% 假阳性，漏过来的非法码仍会查一次 DB。
    # 查到「确实不存在」时写一个空值标记，短时间内重复请求就不再查库。
    null-ttl-seconds: 60
    # 击穿防护：热点 key 过期瞬间并发回源时，用 Redis 互斥锁只放一个线程进 DB，
    # 其余线程自旋等缓存被回填。压测时用 APP_CACHE_MUTEX_ENABLED=false 做对照。
    mutex-enabled: ${APP_CACHE_MUTEX_ENABLED:true}
    # 锁的自动过期时间：防止持锁线程崩溃导致死锁（比业务耗时长得多即可）
    lock-ttl-seconds: 10
    # 未抢到锁的线程自旋等待参数
    spin-wait-ms: 50
    spin-max-times: 20

  access-log:
    # 访问日志写入模式 —— Step 7 的**对照实验开关**（三个取值）：
    #
    #   MQ   （默认）投递到 RocketMQ，由消费者异步落库。
    #         请求线程只做一次 asyncSend（不阻塞等 broker ack）。
    #   SYNC 请求线程直接 INSERT。这是 Step 7 之前的基线行为，
    #         保留它是为了做「同流量、同并发、唯一变量是同步/异步」的对照压测。
    #   OFF  完全不记日志。用来测出「记日志本身」的净开销下界。
    #
    # ⚠ 三个模式的代码路径都真实存在，不是「为了压测写个假分支」——
    #   SYNC 在生产也是合理选择（单机、日志量小、不想引 MQ 时）。
    mode: ${APP_ACCESS_LOG_MODE:MQ}

# ===== 接口文档（Knife4j / OpenAPI3）=====
# 访问 http://localhost:8082/doc.html
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.cityshorturl: debug
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
