# 本地开发 profile：直连容器映射出来的端口（MySQL 3308 / Redis 6380）
spring:
  # ===== MySQL 数据源 =====
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3308/city_url?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=true
    username: root
    password: 123456
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6380
      database: 0
      password:
      timeout: 5000ms

app:
  jwt:
    # 生产必须用环境变量 JWT_SECRET 注入，这里的默认值仅供本地开发。
    # 注意 JJWT 0.12 要求密钥 >= 32 字节，太短启动即报错。
    secret: ${JWT_SECRET:city-short-url-dev-secret-key-change-me-2026-at-least-32-bytes}
    expire-hours: 24
